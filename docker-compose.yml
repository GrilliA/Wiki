services:
  client:
    build: ./dashboard/
    env_file: ./.env
    command: npm run dev
    volumes:
      - ./dashboard/:/client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV}

  server:
    build: ./app
    env_file: ./.env
    command: sh -c "npm run db:migrate && npm run dev"
    volumes:
      - ./app:/app
      - ./app/prisma/migrations:/app/prisma/migrations
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV}
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    env_file: ./.env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    env_file: ./.env
    ports:
      - "5002:5002"
    environment:
      PGADMIN_DEFAULT_EMAIL: trust4u@hotmail.it
      PGADMIN_DEFAULT_PASSWORD: test
      PGADMIN_LISTEN_PORT: 5002
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: 100
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  redis:
    image: redis:7.4
    env_file: ./.env
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    attach: false
    depends_on:
      - server
      - client

volumes:
  pgdata:
  pgadmin-data:
