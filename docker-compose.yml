services:
  client:
    build: ./dashboard/
    env_file: ./.env
    command: npm run dev
    volumes:
      - ./dashboard/:/client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV}

  server:
    build: ./api
    env_file: ./.env
    command: sh -c "npm run db:migrate && npm run dev"
    volumes:
      - ./api:/api
      - ./api/prisma/migrations:/api/prisma/migrations
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV}
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    env_file: ./.env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4
    env_file: ./.env
    ports:
      - "6379:6379"

volumes:
  pgdata:
