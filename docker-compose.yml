services:
  # client:
  #   env_file: ./client/.env
  #   build: ./client/
  #   command: npm run dev
  #   volumes:
  #     - ./client:/web
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=${NODE_ENV}
  #   depends_on:
  #     - server
  server:
    build: ./server
    env_file: ./server/.env
    command: sh -c "npm run db:migrate && npm run dev"
    volumes:
      - ./server:/app
      - ./server/prisma/migrations:/app/prisma/migrations
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV}
    depends_on:
      - db

  db:
    image: postgres:17
    env_file: ./server/.env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    env_file: ./server/.env
    ports:
      - "5002:5002"
    environment:
      PGADMIN_DEFAULT_EMAIL: trust4u@hotmail.it
      PGADMIN_DEFAULT_PASSWORD: test
      PGADMIN_LISTEN_PORT: 5002
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: 100
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      # - client

volumes:
  pgdata:
  pgadmin-data:
